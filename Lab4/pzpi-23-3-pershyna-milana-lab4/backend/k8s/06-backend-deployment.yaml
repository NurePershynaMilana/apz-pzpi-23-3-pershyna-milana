apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: plant-care
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres-service -U plant_user -d plant_care; do
                echo "Waiting for PostgreSQL...";
                sleep 3;
              done;
              echo "PostgreSQL is ready."
      containers:
        - name: backend
          image: plant-care-backend:latest
          # Never pull from registry — use the image loaded into Minikube locally
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: plant-care-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 3
